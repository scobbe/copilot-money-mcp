name: AI Code Review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  review:
    # Skip draft PRs, forked PRs, and Dependabot PRs (secrets are unavailable)
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment:
      name: >-
        ${{ github.event_name != 'pull_request_target' &&
        github.actor != 'dependabot[bot]' &&
        github.event.pull_request.draft != true &&
        (((github.event_name == 'pull_request' || github.event_name == 'workflow_call') &&
          github.event.pull_request.head.repo.full_name == github.repository) ||
         ((github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') &&
          github.ref == 'refs/heads/main' &&
          (github.event.pull_request.head.repo.full_name == '' ||
           github.event.pull_request.head.repo.full_name == github.repository))) &&
        'security-ci-claude' || 'security-ci-untrusted' }}
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Require Claude CI authentication
        env:
          CLAUDE_CI_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CI_TOKEN" ]; then
            echo "::error::Claude CI authentication is unavailable for this context."
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: AI Code Review
        uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Use this job's least-privilege GitHub token without an OIDC exchange.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          track_progress: true
          use_sticky_comment: true
          prompt: |
            Review this PR for the copilot-money-mcp project (MCP server for personal finance data).

            Focus areas:
            1. Code Quality — Clean code, error handling, readability
            2. Security — Vulnerabilities, input validation, data privacy
            3. Performance — Bottlenecks, memory leaks, efficient data access
            4. Testing — Coverage, edge cases, test quality
            5. TypeScript — Proper typing, no any abuse, type safety
            6. MCP Protocol — Correct tool definitions, proper server implementation
            7. Data Privacy — No logging of sensitive financial data

            Be constructive. Praise good patterns too.

          # SECURITY: Allow read-only gh commands — block approve/merge
          claude_args: |
            --model claude-sonnet-4-6
            --allowedTools "Bash(gh pr diff*),Bash(gh pr view*),Read,Grep,Glob"
            --disallowedTools "Bash(gh pr review --approve*),Bash(gh pr merge*),Bash(gh pr close*)"
