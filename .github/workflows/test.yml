name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run type checking
        run: bun run typecheck

      - name: Run linting
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Version sync check
        run: bun run check:version-sync

      - name: MCP registry constraints check (server.json)
        run: bun run check:server-json

      - name: License check (production deps)
        # Stages package.json only (NOT package-lock.json) and runs
        # npm install --omit=dev to mirror scripts/pack-mcpb.ts exactly, so
        # the gate measures the same graph that ships in the .mcpb bundle.
        # The nested quotes in --excludePackages are intentional: inside $(...)
        # bash opens a fresh shell-quoting scope, so the inner "..." is its own
        # context and does not conflict with the outer quoting.
        # license-checker is pinned (not @latest) for supply-chain determinism;
        # bump deliberately when SPDX database updates are needed.
        # --onlyAllow matches flat SPDX IDs only. A dep declaring a composite
        # expression like "(MIT OR Apache-2.0)" will fail the gate even when
        # compatible; fix by adding it to --excludePackages with a comment, or
        # switch to license-checker-rseidelsohn which parses expressions.
        run: |
          mkdir -p .license-check
          cp package.json .license-check/
          (cd .license-check && npm install --omit=dev --ignore-scripts --no-audit --no-fund)
          npx --yes license-checker@25.0.1 \
            --start .license-check \
            --production \
            --onlyAllow 'MIT;ISC;BSD-2-Clause;BSD-3-Clause;Apache-2.0' \
            --excludePackages "copilot-money-mcp@$(node -p "require('./package.json').version")" \
            --summary

  tests:
    name: Unit Tests
    needs: [quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run all tests with coverage
        run: bun test --coverage --coverage-reporter=lcov

      - name: Preserve coverage for the authenticated upload job
        if: (github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push') && github.actor != 'dependabot[bot]'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

  coverage:
    name: Coverage Upload
    needs: [tests]
    if: (github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push') && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-lcov
          path: coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: coverage/lcov.info
          use_oidc: true
          fail_ci_if_error: true

  tests-status:
    # Retain the existing combined check name and failure contract.
    name: Tests
    needs: [tests, coverage]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require passing unit tests and coverage upload
        env:
          UNIT_RESULT: ${{ needs.tests.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          COVERAGE_REQUIRED: ${{ (github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push') && github.actor != 'dependabot[bot]' }}
        run: |
          if [ "$UNIT_RESULT" != success ]; then
            echo "Unit tests did not pass."
            exit 1
          fi
          if [ "$COVERAGE_REQUIRED" = true ] && [ "$COVERAGE_RESULT" != success ]; then
            echo "Required coverage upload did not pass."
            exit 1
          fi
          case "$COVERAGE_RESULT" in
            success|skipped) ;;
            *) echo "Coverage upload did not pass."; exit 1 ;;
          esac
